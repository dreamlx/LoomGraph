[project]
name = "loomgraph"
version = "0.16.0"
description = "Local code knowledge graph — SQLite + sqlite-vec, AST-driven, no RAG framework needed"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DreamLinx", email = "noreply@github.com" }]
maintainers = [{ name = "DreamLinx", email = "noreply@github.com" }]
keywords = [
    "code-intelligence",
    "knowledge-graph",
    "sqlite-vec",
    "code-analysis",
    "ast",
    "embeddings",
    "vector-search",
    "claude-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries",
    "Topic :: Database",
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",

    # Async HTTP (stdlib asyncio is implied, never pin from PyPI)
    "httpx>=0.26",
    "aiofiles>=23.0",

    # Database
    "sqlite-vec>=0.1.9",

    # CLI
    "click>=8.0",
    "rich>=13.0",

    # Code parsing (>=0.33.3: + TS path-alias `./`-prefix fix codeindex#144 → fabricOS @/ alias 0%→96% resolved, drops 27 false-positive orphans; 0.33.1: graph-export honors include: #137; 0.32.0: IMPORTS edges + Java caller fix #76)
    "ai-codeindex>=0.33.3",
    "tree-sitter-python>=0.23",
    "tree-sitter-php>=0.23",

    # MCP server (v0.12.0+)
    "mcp>=1.0",
]

[project.optional-dependencies]
# Java support is opt-in — tree-sitter-java is heavy and pure-Python repos
# don't need it. Install with: `pipx install loomgraph[java]` (#93).
java = ["tree-sitter-java>=0.23.0"]
# TypeScript support is opt-in too — tree-sitter-typescript is heavy and
# pure-Python repos don't need it. Install with: `pipx install loomgraph[typescript]` (#96).
typescript = ["tree-sitter-typescript>=0.23"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-bdd>=7.0",
    "testcontainers>=3.7",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
loomgraph = "loomgraph.cli.main:cli_entry"

[project.urls]
Homepage = "https://github.com/dreamlx/LoomGraph"
Repository = "https://github.com/dreamlx/LoomGraph"
Documentation = "https://github.com/dreamlx/LoomGraph#readme"
Changelog = "https://github.com/dreamlx/LoomGraph/blob/main/CHANGELOG.md"
Issues = "https://github.com/dreamlx/LoomGraph/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loomgraph"]
# README_AI.md files are codeindex auto-generated and rotate frequently —
# they bloat the wheel and aren't useful at runtime.
exclude = ["**/README_AI.md", "**/PROJECT_SYMBOLS.md"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "loomgraph/_skills"

[tool.hatch.build.targets.sdist]
exclude = [
    "/docs/epics",
    "/docs/archive",
    "/.serena",
    "/tests/integration",
    "**/README_AI.md",
    "**/PROJECT_SYMBOLS.md",
    "dist/",
]

# ============== Tool Configurations ==============

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.2",
    "mypy>=1.8",
]

[tool.uv.sources]
# 开发时使用本地路径（可选）
# ai-codeindex = { path = "/Users/dreamlinx/Projects/codeindex" }
# lightrag-hku = { path = "/Users/dreamlinx/Projects/LightRAG" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["loomgraph"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB)",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["src/loomgraph"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
