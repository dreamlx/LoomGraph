[project]
name = "loomgraph"
version = "0.8.0"
description = "Enterprise Code Intelligence Engine - H200 Optimized GraphRAG for Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DreamLinx" }]
keywords = ["code", "graph", "rag", "embedding", "lightrag", "jina", "h200"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",

    # Async
    "asyncio>=3.4",
    "httpx>=0.26",
    "aiofiles>=23.0",

    # Database
    "asyncpg>=0.29",
    "pgvector>=0.2",

    # CLI
    "click>=8.0",
    "rich>=13.0",

    # Code parsing
    "ai-codeindex>=0.20.0",
    "tree-sitter-python>=0.23",
    "tree-sitter-php>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-bdd>=7.0",
    "testcontainers>=3.7",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
loomgraph = "loomgraph.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loomgraph"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "loomgraph/_skills"

# ============== Tool Configurations ==============

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.2",
    "mypy>=1.8",
]

[tool.uv.sources]
# 开发时使用本地路径（可选）
# ai-codeindex = { path = "~/Projects/codeindex" }
# lightrag-hku = { path = "~/Projects/LightRAG" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.lint.isort]
known-first-party = ["loomgraph"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB)",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["src/loomgraph"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
