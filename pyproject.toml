[project]
name = "loomgraph"
version = "0.1.0-dev"
description = "Enterprise Code Intelligence Engine - H200 Optimized GraphRAG for massive codebases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DreamLinx" }
]
keywords = ["code", "graph", "rag", "embedding", "h200", "lightrag", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Database
    "asyncpg>=0.29",
    "pgvector>=0.2",

    # HTTP Client
    "httpx>=0.26",

    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # CLI
    "click>=8.0",
    "rich>=13.0",

    # Async
    "anyio>=4.0",

    # Utilities
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-bdd>=7.0",
    "testcontainers>=4.0",
    "ruff>=0.2",
    "mypy>=1.8",
    "pre-commit>=3.0",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
loomgraph = "loomgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loomgraph"]

# ============================================
# Development Dependencies (local packages)
# ============================================
[tool.uv.sources]
# Local codeindex (until PyPI release)
matrix-codeindex = { path = "/Users/dreamlinx/Projects/codeindex", editable = true }
# Local LightRAG fork
lightrag-hku = { path = "/Users/dreamlinx/Projects/LightRAG", editable = true }

# ============================================
# Tool Configurations
# ============================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PGH",    # pygrep-hooks
    "PLC",    # pylint convention
    "PLE",    # pylint error
    "PLW",    # pylint warning
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B904",   # raise without from in except
]

[tool.ruff.lint.isort]
known-first-party = ["loomgraph"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "pgvector.*",
    "lightrag.*",
    "codeindex.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database)",
    "benchmark: Performance benchmark tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/loomgraph"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
