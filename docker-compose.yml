version: '3.8'

# LoomGraph v0.10.0: PostgreSQL was removed (LightRAG backend is gone).
# Storage is now a single SQLite + sqlite-vec file at ~/.loomgraph/<workspace>.db.
# Only the embedding service remains for local dev; production points
# `embedding.base_url` at a Jina Code V2 endpoint (H200 or hosted).

services:
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: loomgraph-embedding
    command: --model-id jinaai/jina-embeddings-v2-base-code --max-client-batch-size 32
    ports:
      - "8080:80"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - embedding_cache:/data
    restart: unless-stopped

volumes:
  embedding_cache:
    name: loomgraph_embedding_cache
