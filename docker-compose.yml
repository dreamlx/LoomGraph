version: '3.8'

services:
  # PostgreSQL with pgvector (LightRAG storage backend)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightrag-postgres
    environment:
      POSTGRES_DB: loomgraph
      POSTGRES_USER: loomgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomgraph_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomgraph -d loomgraph"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Jina Embedding Service (CPU mode for local dev)
  # For H200 production, use GPU image with --gpus all
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: loomgraph-embedding
    command: --model-id jinaai/jina-embeddings-v2-base-code --max-client-batch-size 32
    ports:
      - "8080:80"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - embedding_cache:/data
    profiles:
      - full  # Only start with: docker compose --profile full up
    restart: unless-stopped

volumes:
  pgdata:
    name: loomgraph_pgdata
  embedding_cache:
    name: loomgraph_embedding_cache
