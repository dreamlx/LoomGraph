# codeindex configuration
# Generated by Interactive Setup Wizard

version: 1

languages:
  - python

include:
  - src/

exclude:
  - "**/*.pyc"
  - "**/.eggs/**"
  - "**/.git/**"
  - "**/.pytest_cache/**"
  - "**/.tox/**"
  - "**/.venv/**"
  - "**/__pycache__/**"
  - "**/build/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/tests/**"
  - "**/venv/**"

# Performance settings
parallel_workers: 8
batch_size: 50

# Git Hooks configuration
hooks:
  post_commit:
    enabled: false

output_file: README_AI.md