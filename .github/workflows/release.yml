name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write    # GitHub Release upload
  id-token: write    # PyPI Trusted Publisher (OIDC)

jobs:
  # Fail-fast gate — kill the workflow in <10s if the tag we're releasing
  # doesn't actually match the version in pyproject.toml / customers/VERSION.
  # Catches the failure mode that bit v0.12.0 release: tag pushed to a
  # commit whose pyproject still had the previous version.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PYPROJECT_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUSTOMERS_VERSION=$(cat customers/VERSION 2>/dev/null | tr -d ' \n' || echo "")
          echo "Tag version:        ${TAG_VERSION}"
          echo "pyproject.toml:     ${PYPROJECT_VERSION}"
          echo "customers/VERSION:  ${CUSTOMERS_VERSION}"
          if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match pyproject.toml ${PYPROJECT_VERSION}."
            echo "::error::Run scripts/bump_version.py ${TAG_VERSION} on the release commit, push, then re-tag."
            exit 1
          fi
          if [ -n "${CUSTOMERS_VERSION}" ] && [ "${CUSTOMERS_VERSION}" != "${PYPROJECT_VERSION}" ]; then
            echo "::error::customers/VERSION ${CUSTOMERS_VERSION} != pyproject.toml ${PYPROJECT_VERSION}."
            exit 1
          fi

  test:
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Unit tests
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build + twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Inspect distribution metadata
        run: twine check dist/*

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/loomgraph/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write    # Trusted Publisher OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC — no API token; project must be configured as a Trusted Publisher
        # at https://pypi.org/manage/project/loomgraph/settings/publishing/

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ needs.build.outputs.version }}
          CHANGELOG=$(sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | head -n -1)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release v${VERSION}"
          fi
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.BODY }}
          files: |
            dist/*.whl
            dist/*.tar.gz
