name: Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      # Type gate: the 117-error backlog hid 4 real runtime bugs (missing
      # `scope` arg in 3 MCP callers, nonexistent ErrorCode.OPERATION_FAILED)
      # — mypy stayed local-only and drifted for months. Kept honest in CI
      # since the 2026-08-17 cleanup (117 → 0).
      - name: Type check
        run: |
          source .venv/bin/activate
          mypy src/

      - name: Docs consistency gate
        run: |
          source .venv/bin/activate
          python scripts/docs_check.py

      - name: Unit tests
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -v --tb=short

      # #179 contract tests: pin the codeindex CLI output shapes loomgraph
      # consumes. NOT under tests/unit/ — a path-filtered `pytest tests/unit/`
      # never collects them, so the #173-class drift guard existed only
      # locally until this step (codex review finding, 2026-08-17).
      - name: Contract tests (codeindex output shapes)
        run: |
          source .venv/bin/activate
          pytest tests/contract/ -v --tb=short
