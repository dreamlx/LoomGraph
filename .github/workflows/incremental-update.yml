name: Incremental Update (Reusable)

on:
  workflow_call:
    inputs:
      embedding_endpoint:
        required: false
        type: string
        default: ''
        description: >-
          Optional OpenAI-compatible embedding endpoint URL. Only needed if the
          indexed workspace should carry vec0 vectors for semantic search
          (embedding is opt-in; default local Ollama won't be reachable from a
          GitHub-hosted runner — supply a runner-reachable endpoint or leave
          blank for a vectors-free structural index).
      working_directory:
        required: false
        type: string
        default: '.'
        description: "Working directory for the repository"
      since:
        required: false
        type: string
        default: 'HEAD~1'
        description: "Git reference to compare from (default: HEAD~1)"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need HEAD~1 to detect changes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ai-codeindex loomgraph

      - name: Detect changed files
        id: changes
        run: |
          cd ${{ inputs.working_directory }}
          # #76 PATH-bypass class (#183): run via the job's interpreter so
          # the pip-installed ai-codeindex is what executes, not whatever a
          # runner image might ship ahead of it on PATH.
          python -m codeindex.cli affected --json --since ${{ inputs.since }} > changed.json

          # Check if any files changed
          CHANGED_COUNT=$(cat changed.json | jq -r '.affected_files | length')
          echo "changed_count=$CHANGED_COUNT" >> $GITHUB_OUTPUT

          if [ "$CHANGED_COUNT" -gt 0 ]; then
            FILES=$(cat changed.json | jq -r '.affected_files[]' | tr '\n' ',' | sed 's/,$//')
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Incremental update
        if: steps.changes.outputs.changed_count > 0
        run: |
          cd ${{ inputs.working_directory }}
          EMBEDDING_FLAG=""
          if [ -n "${{ inputs.embedding_endpoint }}" ]; then
            EMBEDDING_FLAG="--embedding-url ${{ inputs.embedding_endpoint }}"
          fi
          loomgraph update \
            --files "${{ steps.changes.outputs.files }}" \
            $EMBEDDING_FLAG

      - name: No changes
        if: steps.changes.outputs.changed_count == 0
        run: |
          echo "No code files changed. Skipping update."
